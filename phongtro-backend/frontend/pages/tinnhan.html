<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tin nhắn - SmartRoom</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <script type="module" src="../js/core/layout.js"></script>
    <style>
        .chat-container {
            display: grid;
            grid-template-columns: 280px 1fr;
            border: 1px solid var(--border);
            border-radius: var(--radius) var(--radius) 0 0;
            background: var(--bg-elevated);
            min-height: 600px;
        }
        .chat-sidebar {
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }
        .chat-conversations {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .conv-item {
            padding: 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .conv-item:hover, .conv-item.active {
            background: var(--surface);
        }
        .conv-avatar {
            width: 40px; height: 40px; border-radius: 50%;
            background: var(--accent);
            display: grid; place-items: center; font-weight: bold;
        }
        .chat-main {
            display: flex;
            flex-direction: column;
            background: var(--surface);
        }
        .chat-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            font-weight: bold;
            display: flex; justify-content: space-between; align-items: center;
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .msg-bubble {
            max-width: 65%;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .msg-bubble--me {
            background: var(--accent);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .msg-bubble--them {
            background: #2b3956;
            color: white;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .chat-footer {
            padding: 16px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
        }
        .chat-footer input {
            flex: 1;
            background: #151b2b;
            border: 1px solid var(--border);
            color: white;
            padding: 12px 16px;
            border-radius: 20px;
            outline: none;
        }
    </style>
</head>
<body>
    <div id="app-root">
        
        <div class="panel" style="padding: 0; overflow: hidden; border: none; background: transparent;">
            <div class="chat-container">
                <!-- Sidebar các cuộc hội thoại -->
                <div class="chat-sidebar">
                    <div style="padding: 20px; border-bottom: 1px solid var(--border); font-weight: 800;">
                        Tin Nhắn Nhận Gần Đây
                    </div>
                    <div class="chat-conversations" id="conversations">
                        <div class="empty-hint" style="border:none; margin:10px;">Đang tải hội thoại...</div>
                    </div>
                </div>

                <!-- Main khung chat -->
                <div class="chat-main">
                    <div class="chat-header">
                        <span id="chatTargetName">Chọn một cuộc hội thoại...</span>
                        <button id="btnCreateContract" class="btn btn--success btn--sm" style="display:none;font-weight:bold;">Tạo HĐ Mới</button>
                    </div>
                    <div class="chat-messages" id="chatMsgs">
                        <!-- Messages go here -->
                        <div style="text-align:center; color:var(--muted); margin-top: auto; margin-bottom:auto;">Nhắn tin để bắt đầu trao đổi thông tin.</div>
                    </div>
                    <form class="chat-footer" id="chatForm">
                        <input type="text" id="msgInput" placeholder="Nhập tin nhắn..." autocomplete="off" disabled>
                        <button type="submit" class="btn btn--primary" id="btnSend" disabled>Gửi</button>
                    </form>
                </div>
            </div>
        </div>
        
        <!-- Modal Tạo Hợp Đồng -->
        <div id="contractModal" class="modal-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; z-index:999;">
            <div class="modal-content" style="background:var(--bg-elevated); padding:24px; border-radius:var(--radius); width:100%; max-width:400px;">
                <h3 style="margin-top:0;">Tạo Hợp Đồng Mới</h3>
                <form id="contractForm" style="display:flex; flex-direction:column; gap:12px;">
                    <div class="field">
                        <label>Chọn Phòng Đang Trống</label>
                        <select id="contractRoom" required style="width:100%; padding:10px; background:var(--surface); border:1px solid var(--border); color:white; border-radius:var(--radius-sm);">
                            <option value="">-- Đang tải danh sách phòng --</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Ngày bắt đầu thuê</label>
                        <input type="date" id="contractStartDate" required style="width:100%; padding:10px; background:var(--surface); border:1px solid var(--border); color:white; border-radius:var(--radius-sm);">
                    </div>
                    <div class="field">
                        <label>Ngày kết thúc (dự kiến)</label>
                        <input type="date" id="contractEndDate" required style="width:100%; padding:10px; background:var(--surface); border:1px solid var(--border); color:white; border-radius:var(--radius-sm);">
                    </div>
                    <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:10px;">
                        <button type="button" class="btn btn--sm" onclick="document.getElementById('contractModal').style.display='none'">Hủy</button>
                        <button type="submit" class="btn btn--primary btn--sm">Gửi Yêu Cầu HĐ</button>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <!-- Script WS + Socket.io Client -->
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script type="module">
        import { CONFIG, fetchAPI, getRole, getUser, showToast } from "../js/utils/config.js";
        
        const role = getRole();
        const me = getUser();
        let targetUserId = null;
        let currentConvoId = null;

        const socket = io(CONFIG.WS_URL);
        socket.on("connect", () => {
            socket.emit("join", me.id);
        });

        socket.on("receiveMessage", (data) => {
            if (data.conversation_id === currentConvoId) {
                // If the message is from the active conversation, print it
                // Need opponent name? For simplicity and speed just take from header or "Đối tác"
                const oppName = txtTargetName.textContent.replace("Chat với: ", "");
                appendMsg('them', data.message, oppName);
            } else {
                // Notify via toast if not in current convo
                showToast("Bạn có tin nhắn mới!", "success");
                init(); // Reload conversations list
            }
        });

        // Bóc query url param ?userId=...
        const queryParams = new URLSearchParams(window.location.search);
        const forcedTarget = queryParams.get("userId");

        // UI nodes
        const txtTargetName = document.getElementById("chatTargetName");
        const btnCreateHD = document.getElementById("btnCreateContract");
        const chatMsgs = document.getElementById("chatMsgs");
        const msgInput = document.getElementById("msgInput");
        const btnSend = document.getElementById("btnSend");
        
        async function init() {
            if (role === "CHU_TRO") {
                btnCreateHD.style.display = "inline-block";
                btnCreateHD.onclick = async () => {
                    if (!targetUserId) {
                        return showToast("Vui lòng chọn một cuộc hội thoại trước!", "error");
                    }
                    const cModal = document.getElementById("contractModal");
                    cModal.style.display = "flex";
                    // fetch rooms
                    const roomSel = document.getElementById("contractRoom");
                    roomSel.innerHTML = '<option value="">-- Đang tải... --</option>';
                    try {
                        const rooms = await fetchAPI("/phong/me");
                        roomSel.innerHTML = '<option value="">-- Chọn phòng --</option>';
                        rooms.forEach(r => {
                            if(r.status === "AVAILABLE") {
                                const opt = document.createElement("option");
                                opt.value = r.id;
                                opt.textContent = `${r.title} (Giá: ${r.price})`;
                                roomSel.appendChild(opt);
                            }
                        });
                    } catch(err) {
                        roomSel.innerHTML = '<option value="">Lỗi tải phòng</option>';
                    }
                };

                document.getElementById("contractForm").addEventListener("submit", async (e) => {
                    e.preventDefault();
                    const room_id = document.getElementById("contractRoom").value;
                    const start_date = document.getElementById("contractStartDate").value;
                    const end_date = document.getElementById("contractEndDate").value;
                    const roomInfo = document.getElementById("contractRoom").options[document.getElementById("contractRoom").selectedIndex].text;
                    
                    try {
                        await fetchAPI("/hopdong", "POST", {
                            room_id, start_date, end_date, tenant_id: targetUserId
                        });
                        document.getElementById("contractModal").style.display = "none";
                        showToast("Tạo hợp đồng để đối tác duyệt thành công!", "success");
                        
                        // Send chat message
                        const text = `[Hệ Thống] Tôi đã tạo Hợp Đồng cho phòng ${roomInfo}. Vui lòng kiểm tra tab Quản lý Hợp Đồng và xác nhận!`;
                        await fetchAPI("/chat/gui", "POST", { conversation_id: currentConvoId, message: text });
                        appendMsg('me', text, me.fullname || me.username);
                    } catch(err) {
                        showToast(err.message, "error");
                    }
                });
            }

            try {
                // Gọi API list hội thoại
                const listData = await fetchAPI("/chat");

                if(forcedTarget && !listData.find(x => x.opponent_id == forcedTarget)) {
                    // Nếu bắt ép target nhưng chưa có trong list, thêm giả vào
                    listData.unshift({ opponent_id: forcedTarget, name: "Người nhận mới" });
                }

                const cList = document.getElementById("conversations");
                cList.innerHTML = "";
                
                if (listData.length === 0) {
                    cList.innerHTML = '<div class="empty-hint" style="border:none; margin:10px;">Chưa có hội thoại.</div>';
                }

                listData.forEach(c => {
                    const div = document.createElement("div");
                    div.className = "conv-item" + (c.opponent_id == forcedTarget ? " active" : "");
                    div.innerHTML = `
                        <div class="conv-avatar">${c.name.charAt(0).toUpperCase()}</div>
                        <div><b>${c.name}</b></div>
                    `;
                    div.onclick = () => {
                        document.querySelectorAll(".conv-item").forEach(x => x.classList.remove('active'));
                        div.classList.add('active');
                        openChat(c.opponent_id, c.name);
                    };
                    cList.appendChild(div);
                });

                if(forcedTarget) {
                    const targetName = listData.find(x => x.opponent_id == forcedTarget)?.name || "Đối tác";
                    openChat(forcedTarget, targetName);
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function openChat(id, name) {
            targetUserId = id;
            txtTargetName.textContent = "Chat với: " + name;
            msgInput.disabled = false;
            btnSend.disabled = false;
            chatMsgs.innerHTML = `<div style="text-align:center; color:var(--muted); font-size:0.85em;">Đang tải tin nhắn...</div>`;
            
            try {
                // Tạo hoặc lấy ID hội thoại
                const res = await fetchAPI("/chat/tao", "POST", { user_id: id });
                currentConvoId = res.conversation_id;

                // Load lịch sử
                const history = await fetchAPI(`/chat/${currentConvoId}`);
                chatMsgs.innerHTML = `<div style="text-align:center; color:var(--muted); font-size:0.85em; margin-bottom: 12px;">Cuộc hội thoại đã được mã hoá đầu cuối.</div>`;
                
                history.forEach(m => {
                    const isMe = m.sender_id === me.id;
                    appendMsg(isMe ? 'me' : 'them', m.message, isMe ? (me.fullname || me.username) : m.name);
                });
            } catch (err) {
                chatMsgs.innerHTML = `<div style="text-align:center; color:var(--danger); font-size:0.85em;">Lỗi tải tin nhắn.</div>`;
            }
        }

        function appendMsg(who, text, senderName) {
            const div = document.createElement('div');
            div.className = "msg-bubble " + (who === 'me' ? "msg-bubble--me" : "msg-bubble--them");
            
            // Name label
            const title = document.createElement('div');
            title.style.fontSize = "0.75rem";
            title.style.fontWeight = "bold";
            title.style.opacity = "0.8";
            title.style.marginBottom = "4px";
            title.textContent = senderName || "Ẩn danh";
            
            const txt = document.createElement('div');
            txt.textContent = text;
            txt.style.whiteSpace = "pre-wrap";

            div.appendChild(title);
            div.appendChild(txt);
            
            chatMsgs.appendChild(div);
            chatMsgs.scrollTop = chatMsgs.scrollHeight;
        }

        document.getElementById("chatForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const text = msgInput.value.trim();
            if(!text || !currentConvoId) return;

            // Xoá input ngay để tạo cảm giác nhanh
            msgInput.value = "";
            appendMsg('me', text, me.fullname || me.username);
            
            try {
                await fetchAPI("/chat/gui", "POST", {
                    conversation_id: currentConvoId,
                    message: text
                });
                // Khi gửi DB đã gọi io.to để đẩy sang đối tác, ta không cần emit socket thủ công ở đây.
            } catch(err) {
                showToast("Lỗi gửi tin: " + err.message, "error");
            }
        });

        window.addEventListener("load", init);

    </script>
</body>
</html>
