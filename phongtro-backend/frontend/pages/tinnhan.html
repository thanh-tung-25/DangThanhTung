<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tin nhắn - SmartRoom</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <script type="module" src="../js/core/layout.js"></script>
    <style>
        .chat-container {
            display: grid;
            grid-template-columns: 280px 1fr;
            border: 1px solid var(--border);
            border-radius: var(--radius) var(--radius) 0 0;
            background: var(--bg-elevated);
            min-height: 600px;
        }
        .chat-sidebar {
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }
        .chat-conversations {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .conv-item {
            padding: 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .conv-item:hover, .conv-item.active {
            background: var(--surface);
        }
        .conv-avatar {
            width: 40px; height: 40px; border-radius: 50%;
            background: var(--accent);
            display: grid; place-items: center; font-weight: bold;
        }
        .chat-main {
            display: flex;
            flex-direction: column;
            background: var(--surface);
        }
        .chat-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            font-weight: bold;
            display: flex; justify-content: space-between; align-items: center;
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .msg-bubble {
            max-width: 65%;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .msg-bubble--me {
            background: var(--accent);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .msg-bubble--them {
            background: #2b3956;
            color: white;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .chat-footer {
            padding: 16px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
        }
        .chat-footer input {
            flex: 1;
            background: #151b2b;
            border: 1px solid var(--border);
            color: white;
            padding: 12px 16px;
            border-radius: 20px;
            outline: none;
        }
    </style>
</head>
<body>
    <div id="app-root">
        
        <div class="panel" style="padding: 0; overflow: hidden; border: none; background: transparent;">
            <div class="chat-container">
                <!-- Sidebar các cuộc hội thoại -->
                <div class="chat-sidebar">
                    <div style="padding: 20px; border-bottom: 1px solid var(--border); font-weight: 800;">
                        Tin Nhắn Nhận Gần Đây
                    </div>
                    <div class="chat-conversations" id="conversations">
                        <div class="empty-hint" style="border:none; margin:10px;">Đang tải hội thoại...</div>
                    </div>
                </div>

                <!-- Main khung chat -->
                <div class="chat-main">
                    <div class="chat-header">
                        <span id="chatTargetName">Chọn một cuộc hội thoại...</span>
                        <button id="btnCreateContract" class="btn btn--success btn--sm" style="display:none;font-weight:bold;">Tạo HĐ Mới</button>
                    </div>
                    <div class="chat-messages" id="chatMsgs">
                        <!-- Messages go here -->
                        <div style="text-align:center; color:var(--muted); margin-top: auto; margin-bottom:auto;">Nhắn tin để bắt đầu trao đổi thông tin.</div>
                    </div>
                    <form class="chat-footer" id="chatForm">
                        <input type="text" id="msgInput" placeholder="Nhập tin nhắn..." autocomplete="off" disabled>
                        <button type="submit" class="btn btn--primary" id="btnSend" disabled>Gửi</button>
                    </form>
                </div>
            </div>
        </div>

    </div>

    <!-- Script WS + Socket.io Client (Mockup) -->
    <!-- <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script> -->
    <script type="module">
        import { fetchAPI, getRole, getUser, showToast } from "../js/utils/config.js";
        
        const role = getRole();
        const me = getUser();
        let targetUserId = null;

        // Bóc query url param ?userId=...
        const queryParams = new URLSearchParams(window.location.search);
        const forcedTarget = queryParams.get("userId");

        // UI nodes
        const txtTargetName = document.getElementById("chatTargetName");
        const btnCreateHD = document.getElementById("btnCreateContract");
        const chatMsgs = document.getElementById("chatMsgs");
        const msgInput = document.getElementById("msgInput");
        const btnSend = document.getElementById("btnSend");
        
        async function init() {
            if (role === "CHU_TRO") {
                btnCreateHD.style.display = "inline-block";
                btnCreateHD.onclick = () => {
                    const phongName = prompt("Nhập tên phòng sẽ cho thuê (vd P102):");
                    if(phongName) {
                        showToast(`Đã gửi yêu cầu tạo HĐ phòng ${phongName} cho người dùng này!`, "success");
                        // Gửi message mockup type contract
                        appendMsg('me', `[Hệ Thống] Tôi đã tạo Hợp Đồng phòng ${phongName}. Vui lòng kiểm tra Bảng Hợp Đồng của bạn.`);
                    }
                };
            }

            // Gọi API list hội thoại (Mockup)
            const listData = [
                { id: "guest1", name: "Trần Nhắn Tin" },
                { id: "guest2", name: "Nguyễn Vô Danh" }
            ];

            if(forcedTarget && !listData.find(x => x.id == forcedTarget)) {
                listData.unshift({ id: forcedTarget, name: "Người nhận mới" });
            }

            const cList = document.getElementById("conversations");
            cList.innerHTML = "";
            listData.forEach(c => {
                const div = document.createElement("div");
                div.className = "conv-item" + (c.id == forcedTarget ? " active" : "");
                div.innerHTML = `
                    <div class="conv-avatar">${c.name.charAt(0)}</div>
                    <div><b>${c.name}</b></div>
                `;
                div.onclick = () => {
                    document.querySelectorAll(".conv-item").forEach(x => x.classList.remove('active'));
                    div.classList.add('active');
                    openChat(c.id, c.name);
                };
                cList.appendChild(div);
            });

            if(forcedTarget) {
                openChat(forcedTarget, listData[0].name);
            }
        }

        function openChat(id, name) {
            targetUserId = id;
            txtTargetName.textContent = "Chat với: " + name;
            msgInput.disabled = false;
            btnSend.disabled = false;
            chatMsgs.innerHTML = `<div style="text-align:center; color:var(--muted); font-size:0.85em;">Cuộc hội thoại đã được mã hoá đầu cuối.</div>`;
            
            // fetch history here...
            appendMsg('them', `Chào bạn, mình muốn hỏi về phòng.`);
        }

        function appendMsg(who, text) {
            const div = document.createElement('div');
            div.className = "msg-bubble " + (who === 'me' ? "msg-bubble--me" : "msg-bubble--them");
            div.textContent = text;
            chatMsgs.appendChild(div);
            chatMsgs.scrollTop = chatMsgs.scrollHeight;
        }

        document.getElementById("chatForm").addEventListener("submit", (e) => {
            e.preventDefault();
            const text = msgInput.value.trim();
            if(!text) return;

            appendMsg('me', text);
            msgInput.value = "";
            
            // Socket io gửi tin: Socket.emit("send", { to: targetUserId, msg: text })
        });

        window.addEventListener("load", init);

    </script>
</body>
</html>
