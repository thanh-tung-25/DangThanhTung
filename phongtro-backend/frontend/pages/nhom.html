<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chat Nhóm - SmartRoom</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <script type="module" src="../js/core/layout.js"></script>
    <style>
        .chat-container {
            display: grid;
            grid-template-columns: 280px 1fr;
            border: 1px solid var(--border);
            border-radius: var(--radius) var(--radius) 0 0;
            background: var(--bg-elevated);
            min-height: 70vh;
        }
        .chat-sidebar {
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            background: var(--surface);
        }
        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-groups {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .group-item {
            padding: 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s ease;
        }
        .group-item:hover, .group-item.active {
            background: rgba(255, 255, 255, 0.05);
            border-left: 3px solid var(--accent);
        }
        .group-avatar {
            width: 40px; height: 40px; border-radius: 8px;
            background: linear-gradient(135deg, var(--accent), #ff9a9e);
            display: grid; place-items: center; font-weight: bold; color: white;
            font-size: 18px;
        }
        .chat-main {
            display: flex;
            flex-direction: column;
            background: var(--bg);
            position: relative;
        }
        .chat-header {
            padding: 16px 20px;
            background: var(--bg-elevated);
            border-bottom: 1px solid var(--border);
            font-weight: bold;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .msg-row {
            display: flex;
            gap: 10px;
            max-width: 75%;
        }
        .msg-row--me {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .msg-row--them {
            align-self: flex-start;
        }
        .msg-avatar {
            width: 32px; height: 32px; border-radius: 50%;
            background: var(--surface); display: grid; place-items: center;
            font-size: 12px; font-weight: bold; flex-shrink: 0;
            margin-top: auto;
        }
        .msg-content {
            display: flex; flex-direction: column; gap: 4px;
        }
        .msg-sender {
            font-size: 11px; color: var(--muted);
            margin-left: 4px;
        }
        .msg-row--me .msg-sender {
            display: none;
        }
        .msg-bubble {
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.4;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            word-break: break-word;
        }
        .msg-row--me .msg-bubble {
            background: var(--accent);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .msg-row--them .msg-bubble {
            background: var(--surface);
            color: #e2e8f0;
            border-bottom-left-radius: 4px;
        }
        .chat-footer {
            padding: 16px 20px;
            background: var(--bg-elevated);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
        }
        .chat-footer input {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            color: white;
            padding: 14px 20px;
            border-radius: 24px;
            outline: none;
            transition: all 0.3s;
        }
        .chat-footer input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }
        .chat-footer button {
            border-radius: 24px;
            padding: 0 24px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div id="app-root">
        <div class="panel" style="padding: 0; max-width: 1000px; margin: 0 auto; border:none; box-shadow:none;">
            <div class="chat-container">
                <!-- Sidebar -->
                <div class="chat-sidebar">
                    <div class="sidebar-header">
                        <h3 style="margin:0; font-size: 16px;">Phòng Nhóm</h3>
                        <button class="btn btn--sm" id="btnCreateGroup" style="background:var(--accent); color:white; padding: 4px 10px;">+ Tạo</button>
                    </div>
                    <div class="chat-groups" id="groupsList">
                        <!-- Danh sach nhom rendered by JS -->
                    </div>
                </div>

                <!-- Main Chat -->
                <div class="chat-main" id="chatMain" style="display: none;">
                    <div class="chat-header">
                        <div style="display:flex; align-items:center; gap:12px;">
                            <div class="group-avatar" id="activeGroupAvatar">#</div>
                            <div>
                                <h3 id="activeGroupName" style="margin:0;">Tên nhóm</h3>
                                <div style="font-size:12px; color:var(--success); display:flex; align-items:center; gap:4px; margin-top:2px;">
                                    <span style="width:6px; height:6px; border-radius:50%; background:var(--success); display:inline-block;"></span>
                                    Đang hoạt động
                                </div>
                            </div>
                        </div>
                        <button class="btn btn--ghost btn--sm" id="btnAddMember" style="border:1px solid var(--border); border-radius:14px;">+ Thành viên</button>
                    </div>
                    <div class="chat-messages" id="messagesContainer">
                        <!-- Tin nhan rendered by JS -->
                    </div>
                    <form class="chat-footer" id="chatForm">
                        <input type="text" id="msgInput" placeholder="Nhập tin nhắn vào nhóm..." autocomplete="off">
                        <button type="submit" class="btn btn--primary">Gửi</button>
                    </form>
                </div>

                <!-- Empty State -->
                <div id="emptyState" style="display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--muted); height:100%;">
                    <div style="font-size: 48px; margin-bottom: 16px;">💬</div>
                    <h3>Chào mừng đến với Group Chat</h3>
                    <p>Chọn một nhóm bên trái để bàn luận</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Template Nhom -->
    <template id="group-tmpl">
        <div class="group-item" data-id="">
            <div class="group-avatar" data-field="initials">#</div>
            <div>
                <div style="font-weight: 600; font-size: 14px; text-transform: capitalize;" data-field="name">Group Name</div>
            </div>
        </div>
    </template>

    <script type="module">
        import { fetchAPI, getUser, showToast } from "../js/utils/config.js";

        const user = getUser();
        let selectedGroupId = null;
        let pollInterval = null;

        const groupsList = document.getElementById("groupsList");
        const messagesContainer = document.getElementById("messagesContainer");
        const emptyState = document.getElementById("emptyState");
        const chatMain = document.getElementById("chatMain");
        const activeGroupName = document.getElementById("activeGroupName");
        const activeGroupAvatar = document.getElementById("activeGroupAvatar");
        const msgInput = document.getElementById("msgInput");

        // TẠO NHÓM MỚI
        document.getElementById("btnCreateGroup").addEventListener("click", async () => {
            const name = prompt("Nhập tên nhóm phòng muốn quản lý chung:\n(VD: Phòng trọ Cô Xuân - Hoàng Mai)");
            if(name && name.trim()){
                try {
                    await fetchAPI("/nhom/tao", "POST", { name: name.trim() });
                    showToast("Đã rải băng khánh thành nhóm mới!");
                    loadGroups();
                } catch(e) {
                    showToast(e.message, "error");
                }
            }
        });

        // THÊM THÀNH VIÊN
        document.getElementById("btnAddMember").addEventListener("click", async () => {
            if(!selectedGroupId) return;
            const userId = prompt("Mời thêm thành viên (Nhập chính xác ID người thuê trên Hợp Đồng):");
            if(userId && !isNaN(userId)){
                try {
                    await fetchAPI("/nhom/them", "POST", { group_id: selectedGroupId, user_id: parseInt(userId) });
                    showToast("Thêm mã số thành công!");
                } catch(e) {
                    showToast("ID không đúng hoặc chưa hợp lệ", "error");
                }
            }
        });

        // TẢI DANH SÁCH NHÓM
        async function loadGroups() {
            try {
                const groups = await fetchAPI("/nhom");
                groupsList.innerHTML = "";
                if(groups.length === 0) {
                    groupsList.innerHTML = "<div style='color:var(--muted);text-align:center;padding:20px;font-size:13px;'>Bạn chưa có nhóm nào. Nhấn biểu tượng + Tạo.</div>";
                    return;
                }
                
                const tmpl = document.getElementById("group-tmpl");
                groups.forEach(g => {
                    const node = tmpl.content.cloneNode(true);
                    const item = node.querySelector('.group-item');
                    item.dataset.id = g.id;
                    if(selectedGroupId === g.id) item.classList.add("active");
                    
                    node.querySelector('[data-field="name"]').textContent = g.name;
                    node.querySelector('[data-field="initials"]').textContent = g.name.charAt(0).toUpperCase();
                    
                    item.addEventListener("click", () => {
                        document.querySelectorAll('.group-item').forEach(el => el.classList.remove('active'));
                        item.classList.add('active');
                        openGroupSession(g.id, g.name);
                    });
                    
                    groupsList.appendChild(node);
                });
            } catch(e) {
                console.log(e);
            }
        }

        // MỞ KHUNG CHAT 1 NHÓM
        function openGroupSession(groupId, name) {
            selectedGroupId = groupId;
            emptyState.style.display = "none";
            chatMain.style.display = "flex";
            activeGroupName.textContent = name;
            activeGroupAvatar.textContent = name.charAt(0).toUpperCase();
            
            if(pollInterval) clearInterval(pollInterval);
            
            pullMessages(); // tải ngay lập tức
            pollInterval = setInterval(pullMessages, 2000); // Live poll
        }

        let isUserScrolling = false;
        messagesContainer.addEventListener('scroll', () => {
            const isAtBottom = messagesContainer.scrollHeight - messagesContainer.scrollTop <= messagesContainer.clientHeight + 50;
            isUserScrolling = !isAtBottom;
        });

        // BỐC LỊCH SỬ TIN NHẮN
        async function pullMessages() {
            if(!selectedGroupId) return;
            try {
                const msgs = await fetchAPI(`/nhom/${selectedGroupId}/messages`);
                messagesContainer.innerHTML = "";
                if(msgs.length === 0){
                    messagesContainer.innerHTML = "<div style='text-align:center; color:var(--muted); margin-top:20px;'>Hội thoại vắng lặng. Hãy phá vỡ bầu không khí!</div>";
                    return;
                }

                msgs.forEach(m => {
                    const isMe = m.sender_id === user.id;
                    const row = document.createElement("div");
                    row.className = `msg-row ${isMe ? 'msg-row--me' : 'msg-row--them'}`;
                    
                    const senderName = m.fullname || m.username || "User ID " + m.sender_id;
                    const initials = senderName.charAt(0).toUpperCase();

                    row.innerHTML = `
                        <div class="msg-avatar">${initials}</div>
                        <div class="msg-content">
                            <span class="msg-sender">${senderName} ${m.role === 'CHU_TRO' ? '(Admin)' : ''}</span>
                            <div class="msg-bubble">${m.message}</div>
                        </div>
                    `;
                    messagesContainer.appendChild(row);
                });

                if (!isUserScrolling) {
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                }
            } catch(e) {
                console.error(e);
            }
            // Auto reload groups just in case a new group was added implicitly or name changed
            // loadGroups();  // no need to reload groups while chatting.
        }

        // GỬI TIN MÈO
        document.getElementById("chatForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const text = msgInput.value.trim();
            if(!text || !selectedGroupId) return;
            
            msgInput.value = "";
            try {
                await fetchAPI("/nhom/gui", "POST", { group_id: selectedGroupId, message: text });
                isUserScrolling = false; 
                pullMessages(); // Refresh UI instantly
            } catch(error) {
                showToast("Lỗi nghẽn mạng: " + error.message, "error");
            }
        });

        // Boot
        window.addEventListener("load", loadGroups);
    </script>
</body>
</html>
