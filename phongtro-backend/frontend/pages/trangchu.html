<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trang chủ - Bảng tin</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <script type="module" src="../js/core/layout.js"></script>
</head>
<body>
    <div id="app-root">
        <!-- Layout.js sẽ chèn Topbar và Sidebar vào đây -->
        <!-- Nội dung dưới đây là Main Content -->
        
        <div class="panel" style="max-width: 800px; margin: 0 auto;">
            
            <!-- Vùng đăng bài dành cho Chủ Trọ -->
            <div id="composer-area" style="display: none;">
                <div class="composer">
                    <div class="composer__head">
                        <span class="composer__title">Đăng tin phòng trọ</span>
                    </div>
                    <form id="postForm" class="composer__body">
                        <textarea id="postContent" class="composer__input" rows="3" placeholder="Bạn có phòng nào đang trống muốn cho thuê?..." required></textarea>
                        <div class="field" style="margin-top: 5px;">
                            <select id="postRoom" required>
                                <option value="">-- Chọn phòng trống để quảng cáo --</option>
                            </select>
                        </div>
                        <div class="composer__actions">
                            <button type="submit" class="btn btn--primary" id="btnPost">Đăng bài</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="panel__head">
                <h2 class="panel__title">Phòng Trọ Mới Nhất</h2>
                <p class="panel__desc">Khám phá các phòng trọ đang được cho thuê</p>
            </div>

            <!-- Feed Bài Đăng -->
            <div id="feed-container" class="stack--posts">
                <div class="empty-hint">Đang tải bảng tin...</div>
            </div>
            
        </div>

        <!-- Template Bài viết -->
        <template id="post-tmpl">
            <div class="post-card post">
                <div class="post__head">
                    <div class="post__avatar" data-field="avatarInitial">A</div>
                    <div class="post__who">
                        <div class="post__author" data-field="authorName">Tên chủ trọ</div>
                        <div class="post__meta">
                            <span class="post__room" data-field="roomName">Phòng 102</span>
                            <span class="post__sep">•</span>
                            <span data-field="createdAt">Vừa xong</span>
                        </div>
                    </div>
                </div>
                <div class="post__body" data-field="content">Nội dung bài viết...</div>
                <div class="post__actions">
                    <button class="btn btn--primary btn--sm btn-contact" data-action="contact">
                        Liên hệ chủ trọ
                    </button>
                </div>
            </div>
        </template>
        
    </div>

    <script type="module">
        import { CONFIG, fetchAPI, getRole, getUser, showToast } from "../js/utils/config.js";

        const role = getRole();
        const user = getUser();
        const composerArea = document.getElementById("composer-area");
        const roomSelect = document.getElementById("postRoom");
        
        // Hiện khung Đăng Bài nếu là Chủ Trọ
        if (role === "CHU_TRO") {
            composerArea.style.display = "block";
            loadMyRooms();
        }

        async function loadMyRooms() {
            try {
                // Fetch danh sách phòng của chủ trọ để họ chọn khi đăng bài
                const rooms = await fetchAPI("/phong");
                rooms.forEach(r => {
                    if(r.trang_thai === "TRONG") { // chỉ đăng phòng trống
                        const opt = document.createElement("option");
                        opt.value = r.id;
                        opt.textContent = r.ten_phong + ` (Giá: ${r.gia_thue} đ)`;
                        roomSelect.appendChild(opt);
                    }
                });
            } catch(e) {
                console.log(e);
            }
        }

        // Handle Form Đăng Bài
        document.getElementById("postForm")?.addEventListener("submit", async(e) => {
            e.preventDefault();
            const noi_dung = document.getElementById("postContent").value;
            const phong_id = roomSelect.value;
            
            try {
                await fetchAPI("/baidang", "POST", { noi_dung, phong_id });
                showToast("Đăng bài thành công!");
                document.getElementById("postContent").value = "";
                loadFeed();
            } catch(err) {
                showToast(err.message, "error");
            }
        });

        // Load Feed Board
        async function loadFeed() {
            const container = document.getElementById("feed-container");
            try {
                const posts = await fetchAPI("/baidang"); // Backend cần có GET /baidang
                if (!posts || posts.length === 0) {
                    container.innerHTML = '<div class="empty-hint">Chưa có bài đăng nào.</div>';
                    return;
                }

                container.innerHTML = "";
                const tmpl = document.getElementById("post-tmpl");

                posts.forEach(p => {
                    const node = tmpl.content.cloneNode(true);
                    
                    const authorName = p.nguoi_dang?.fullname || "Chủ Trọ";
                    node.querySelector('[data-field="avatarInitial"]').textContent = authorName.charAt(0).toUpperCase();
                    node.querySelector('[data-field="authorName"]').textContent = authorName;
                    node.querySelector('[data-field="roomName"]').textContent = p.phong?.ten_phong || "Phòng Trọ";
                    node.querySelector('[data-field="createdAt"]').textContent = new Date(p.createdAt).toLocaleString("vi-VN");
                    node.querySelector('[data-field="content"]').textContent = p.noi_dung;

                    // Nếu user là chủ bài viết, ẩn nút Liên Hệ
                    const btnContact = node.querySelector('.btn-contact');
                    if (p.nguoi_dang?.id === user.id) {
                        btnContact.style.display = "none";
                    } else {
                        btnContact.onclick = () => {
                            // Chuyển tới trang tin nhắn, query param là id của chủ bài để tự động mở chat
                            window.location.href = `tinnhan.html?userId=${p.nguoi_dang.id}`;
                        };
                    }

                    container.appendChild(node);
                });
            } catch (err) {
                container.innerHTML = '<div class="empty-hint error">Lỗi tải dữ liệu.</div>';
            }
        }

        window.addEventListener("load", loadFeed);
    </script>
</body>
</html>
