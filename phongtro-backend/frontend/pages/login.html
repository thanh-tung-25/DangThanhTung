<div class="container" style="min-height: 80vh; display: flex; align-items: center; justify-content: center;">
    <div class="card-3d" style="width: 100%; max-width: 450px;">
        <h2 id="auth-title" class="text-center text-cyan" style="font-size: 2rem; margin-bottom: 2rem; font-weight: 700;">
            Đăng Nhập
        </h2>
        
        <form id="auth-form">
            <div class="form-group">
                <label class="form-label"><i class="fa-solid fa-user"></i> Tên đăng nhập</label>
                <input type="text" id="username" class="form-control" required placeholder="Nhập tên đăng nhập">
            </div>
            
            <div class="form-group">
                <label class="form-label"><i class="fa-solid fa-lock"></i> Mật khẩu</label>
                <input type="password" id="password" class="form-control" required placeholder="Nhập mật khẩu">
            </div>
            
            <button type="submit" id="auth-submit-btn" class="btn btn-primary" style="width: 100%; margin-top: 1rem; font-size: 1.1rem; padding: 1rem;">
                Xác Nhận
            </button>
        </form>
        
        <div class="text-center" style="margin-top: 2rem; color: var(--clr-text-muted);">
            <span id="auth-switch-text">Chưa có tài khoản?</span>
            <a href="/register" id="auth-switch-link" data-link class="text-cyan" style="text-decoration: none; font-weight: bold; margin-left: 0.5rem;">Đăng ký ngay</a>
        </div>
    </div>
</div>
