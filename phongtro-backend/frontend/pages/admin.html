<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bảng Điều Khiển Admin - SmartRoom</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <script type="module" src="../js/core/layout.js"></script>
    <style>
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }
        .stat-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: var(--accent);
        }
        .stat-card.danger::before { background: var(--danger); }
        .stat-card.success::before { background: var(--success); }
        .stat-card.warn::before { background: #f59e0b; }
        .stat-num {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent);
            line-height: 1;
        }
        .stat-card.danger .stat-num { color: var(--danger); }
        .stat-card.success .stat-num { color: var(--success); }
        .stat-card.warn .stat-num { color: #f59e0b; }
        .stat-label { font-size: 13px; color: var(--muted); }
        .section-title {
            font-size: 17px; font-weight: 700;
            display: flex; align-items: center; gap: 8px;
            margin-bottom: 14px;
        }
        .fine-table { width: 100%; border-collapse: collapse; }
        .fine-table th {
            text-align: left; padding: 10px 14px;
            font-size: 12px; text-transform: uppercase; color: var(--muted);
            border-bottom: 1px solid var(--border);
        }
        .fine-table td {
            padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,0.04);
            font-size: 14px; vertical-align: middle;
        }
        .fine-table tr:hover td { background: var(--surface); }
        .badge-status {
            display: inline-block; padding: 3px 10px;
            border-radius: 20px; font-size: 11px; font-weight: 600;
        }
        .badge-status.unpaid { background: rgba(239,68,68,0.15); color: #ef4444; }
        .badge-status.paid { background: rgba(34,197,94,0.15); color: #22c55e; }
        .user-table { width: 100%; border-collapse: collapse; }
        .user-table th {
            text-align: left; padding: 10px 14px;
            font-size: 12px; text-transform: uppercase; color: var(--muted);
            border-bottom: 1px solid var(--border);
        }
        .user-table td {
            padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,0.04);
            font-size: 14px; vertical-align: middle;
        }
        .user-table tr:hover td { background: var(--surface); }
        .role-badge {
            display: inline-block; padding: 2px 8px; border-radius: 8px;
            font-size: 11px; font-weight: 600;
        }
        .role-badge.CHU_TRO { background: rgba(99,102,241,0.15); color: #818cf8; }
        .role-badge.NGUOI_THUE { background: rgba(34,197,94,0.15); color: #22c55e; }
        .role-badge.ADMIN { background: rgba(239,68,68,0.15); color: #ef4444; }
        .section-card {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 24px;
        }
        .empty-note {
            text-align: center; padding: 32px; color: var(--muted); font-size: 14px;
        }
        .search-bar {
            display: flex; gap: 8px; margin-bottom: 16px;
        }
        .search-bar input {
            flex: 1; background: var(--bg); border: 1px solid var(--border);
            color: white; padding: 10px 14px; border-radius: var(--radius-sm);
            outline: none; font-size: 14px;
        }
        .search-bar input:focus { border-color: var(--accent); }
    </style>
</head>
<body>
<div id="app-root">
    <div class="panel" style="border:none; box-shadow:none; padding:0;">

        <!-- Thống Kê -->
        <div class="panel__head" style="margin-bottom: 24px;">
            <h2 class="panel__title">👮 Bảng Điều Khiển Admin</h2>
            <p class="panel__desc">Quản lý hệ thống, phiếu phạt và người dùng vi phạm</p>
        </div>

        <div class="stat-grid" id="statGrid">
            <div class="stat-card">
                <div class="stat-num" id="statUsers">—</div>
                <div class="stat-label">Tổng Người Dùng</div>
            </div>
            <div class="stat-card success">
                <div class="stat-num" id="statChuTro">—</div>
                <div class="stat-label">Chủ Trọ</div>
            </div>
            <div class="stat-card">
                <div class="stat-num" id="statNguoiThue">—</div>
                <div class="stat-label">Người Thuê</div>
            </div>
            <div class="stat-card warn">
                <div class="stat-num" id="statFinesUnpaid">—</div>
                <div class="stat-label">Phiếu Phạt Chưa Nộp</div>
            </div>
            <div class="stat-card danger">
                <div class="stat-num" id="statFinesTotal">—</div>
                <div class="stat-label">Tổng Tiền Phạt (VNĐ)</div>
            </div>
        </div>

        <!-- Danh Sách Phiếu Phạt -->
        <div class="section-card">
            <div class="section-title">🔨 Lịch Sử Biên Bản Phạt</div>
            <div id="finesContainer">
                <div class="empty-note">Đang tải...</div>
            </div>
        </div>

        <!-- Danh Sách Người Dùng -->
        <div class="section-card">
            <div class="section-title">👥 Danh Sách Người Dùng</div>
            <div class="search-bar">
                <input type="text" id="userSearch" placeholder="Tìm kiếm theo tên đăng nhập...">
                <button class="btn btn--sm btn--primary" id="btnSearch" style="padding: 0 16px;">Tìm</button>
            </div>
            <div id="usersContainer">
                <div class="empty-note">Đang tải...</div>
            </div>
        </div>

    </div>
</div>

<!-- Fine Modal -->
<div id="fineModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); align-items:center; justify-content:center; z-index:999;">
    <div style="background:var(--bg-elevated); padding:28px; border-radius:var(--radius); width:100%; max-width:420px; border:1px solid var(--border);">
        <h3 style="margin-top:0; color:var(--danger);">🔨 Lập Phiếu Phạt</h3>
        <p style="color:var(--muted); font-size:13px;">Đối với: <strong id="fineTargetName" style="color:white;"></strong></p>
        <form id="fineForm" style="display:flex; flex-direction:column; gap:12px; margin-top:16px;">
            <input type="hidden" id="fineUserId">
            <div>
                <label style="font-size:13px; color:var(--muted); display:block; margin-bottom:6px;">Số Tiền Phạt (VNĐ)</label>
                <input type="number" id="fineAmount" placeholder="VD: 500000" min="1" required style="width:100%; background:var(--bg); border:1px solid var(--border); color:white; padding:10px 14px; border-radius:var(--radius-sm); outline:none; box-sizing:border-box;">
            </div>
            <div>
                <label style="font-size:13px; color:var(--muted); display:block; margin-bottom:6px;">Lý Do Vi Phạm</label>
                <textarea id="fineReason" rows="3" required placeholder="VD: Đăng thông tin sai lệch về giá phòng..." style="width:100%; background:var(--bg); border:1px solid var(--border); color:white; padding:10px 14px; border-radius:var(--radius-sm); outline:none; resize:vertical; box-sizing:border-box;"></textarea>
            </div>
            <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:8px;">
                <button type="button" class="btn btn--ghost btn--sm" onclick="document.getElementById('fineModal').style.display='none'">Hủy</button>
                <button type="submit" class="btn btn--sm" style="background:var(--danger); color:white;">⚖️ Xác Nhận Phạt</button>
            </div>
        </form>
    </div>
</div>

<script type="module">
    import { fetchAPI, getRole, getUser, showToast } from "../js/utils/config.js";

    const role = getRole();
    const user = getUser();

    // Guard: chỉ admin
    if (role !== "ADMIN") {
        window.location.href = "trangchu.html";
    }

    async function loadStats() {
        try {
            const users = await fetchAPI("/admin/users");
            const total = users.length;
            const chuTro = users.filter(u => u.role === "CHU_TRO").length;
            const nguoiThue = users.filter(u => u.role === "NGUOI_THUE").length;
            document.getElementById("statUsers").textContent = total;
            document.getElementById("statChuTro").textContent = chuTro;
            document.getElementById("statNguoiThue").textContent = nguoiThue;
        } catch(e) {}
        
        try {
            const fines = await fetchAPI("/admin/phieu-phat");
            const unpaid = fines.filter(f => f.status === "UNPAID").length;
            const total = fines.reduce((s, f) => s + parseFloat(f.amount), 0);
            document.getElementById("statFinesUnpaid").textContent = unpaid;
            document.getElementById("statFinesTotal").textContent = total.toLocaleString("vi-VN");
            renderFines(fines);
        } catch(e) {}
    }

    function renderFines(fines) {
        const container = document.getElementById("finesContainer");
        if (!fines || fines.length === 0) {
            container.innerHTML = '<div class="empty-note">Chưa có biên bản phạt nào.</div>';
            return;
        }
        container.innerHTML = `
            <table class="fine-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Người Bị Phạt</th>
                        <th>Số Tiền</th>
                        <th>Lý Do</th>
                        <th>Trạng Thái</th>
                        <th>Ngày Lập</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="finesTbody"></tbody>
            </table>`;
        const tbody = document.getElementById("finesTbody");
        fines.forEach(f => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${f.id}</td>
                <td><strong>${f.user_name || f.user_id}</strong></td>
                <td style="color:var(--danger); font-weight:600;">${parseFloat(f.amount).toLocaleString("vi-VN")} ₫</td>
                <td style="max-width:220px; white-space:pre-wrap;">${f.reason}</td>
                <td><span class="badge-status ${f.status === 'PAID' ? 'paid' : 'unpaid'}">${f.status === 'PAID' ? '✅ Đã nộp' : '⏳ Chưa nộp'}</span></td>
                <td>${new Date(f.created_at).toLocaleDateString("vi-VN")}</td>
                <td>${f.status === "UNPAID" ? `<button class="btn btn--sm btn--ghost btn-mark-paid" data-id="${f.id}">Đánh dấu Đã Nộp</button>` : ""}</td>
            `;
            tbody.appendChild(tr);
        });

        document.querySelectorAll(".btn-mark-paid").forEach(btn => {
            btn.addEventListener("click", async () => {
                try {
                    await fetchAPI(`/admin/phieu-phat/${btn.dataset.id}/da-nop`, "PUT");
                    showToast("Đã cập nhật trạng thái nộp phạt!", "success");
                    loadStats();
                } catch(e) {
                    showToast(e.message, "error");
                }
            });
        });
    }

    let allUsers = [];
    async function loadUsers() {
        try {
            allUsers = await fetchAPI("/admin/users");
            renderUsers(allUsers);
        } catch(e) {}
    }

    function renderUsers(list) {
        const container = document.getElementById("usersContainer");
        if (!list || list.length === 0) {
            container.innerHTML = '<div class="empty-note">Không tìm thấy người dùng.</div>';
            return;
        }
        container.innerHTML = `
            <table class="user-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Tài Khoản</th>
                        <th>Email</th>
                        <th>Vai Trò</th>
                        <th>Ngày Tạo</th>
                        <th>Thao Tác</th>
                    </tr>
                </thead>
                <tbody id="usersTbody"></tbody>
            </table>`;
        const tbody = document.getElementById("usersTbody");
        list.forEach(u => {
            if (u.role === "ADMIN") return; // ẩn tài khoản admin
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${u.id}</td>
                <td><strong>${u.username}</strong></td>
                <td>${u.email || "—"}</td>
                <td><span class="role-badge ${u.role}">${u.role === 'CHU_TRO' ? 'Chủ Trọ' : 'Người Thuê'}</span></td>
                <td>${new Date(u.created_at).toLocaleDateString("vi-VN")}</td>
                <td>
                    <button class="btn btn--sm btn--danger btn-fine-user" data-id="${u.id}" data-name="${u.username}" style="font-size:12px;">🔨 Phạt</button>
                </td>
            `;
            tbody.appendChild(tr);
        });

        document.querySelectorAll(".btn-fine-user").forEach(btn => {
            btn.addEventListener("click", () => {
                document.getElementById("fineUserId").value = btn.dataset.id;
                document.getElementById("fineTargetName").textContent = btn.dataset.name;
                document.getElementById("fineAmount").value = "";
                document.getElementById("fineReason").value = "";
                document.getElementById("fineModal").style.display = "flex";
            });
        });
    }

    // Search
    document.getElementById("btnSearch").addEventListener("click", () => {
        const q = document.getElementById("userSearch").value.toLowerCase();
        renderUsers(allUsers.filter(u => u.username.toLowerCase().includes(q)));
    });
    document.getElementById("userSearch").addEventListener("keyup", (e) => {
        if(e.key === "Enter") document.getElementById("btnSearch").click();
    });

    // Form phạt
    document.getElementById("fineForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const userId = document.getElementById("fineUserId").value;
        const amount = document.getElementById("fineAmount").value;
        const reason = document.getElementById("fineReason").value;
        try {
            await fetchAPI("/admin/phat", "POST", { user_id: parseInt(userId), amount: parseFloat(amount), reason });
            showToast("Đã lập biên bản phạt thành công!", "success");
            document.getElementById("fineModal").style.display = "none";
            loadStats();
        } catch(err) {
            showToast("Lỗi: " + err.message, "error");
        }
    });

    window.addEventListener("load", () => {
        loadStats();
        loadUsers();
    });
</script>
</body>
</html>
