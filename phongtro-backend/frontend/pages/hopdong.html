<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hợp Đồng - SmartRoom</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <script type="module" src="../js/core/layout.js"></script>
    <style>
        .contract-doc {
            background: #fff;
            color: #0f1419;
            padding: 40px;
            border-radius: var(--radius-sm);
            max-width: 800px;
            margin: 0 auto;
            line-height: 1.8;
            box-shadow: var(--shadow);
            font-family: "Times New Roman", serif;
        }
        .contract-title {
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 24px;
            text-transform: uppercase;
        }
        .contract-party {
            font-weight: 700;
            margin-top: 20px;
            font-size: 1.1rem;
        }
        .contract-meta {
            color: var(--muted);
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="app-root">
        <!-- layout -->
        
        <div class="panel" style="max-width: 900px; margin: 0 auto;">
            <div class="panel__head" style="display:flex; justify-content:space-between; align-items:center;">
                <h2 class="panel__title" style="margin:0;">Chi tiết Hợp đồng</h2>
                <button class="btn btn--success" id="btnSign" style="display:none;font-weight:bold;">Đồng ý Ký Kết</button>
            </div>

            <div id="contract-view">
                <div class="empty-hint">Đang tải hợp đồng...</div>
            </div>
            
        </div>
    </div>

    <script type="module">
        import { fetchAPI, getRole, getUser, showToast } from "../js/utils/config.js";

        // param
        const urlParams = new URLSearchParams(window.location.search);
        let contractId = urlParams.get("id"); // URL có thể là /hopdong.html?id=123 (nếu xem chi tiết)
        const role = getRole();
        
        async function loadContract() {
            const view = document.getElementById("contract-view");
            try {
                // Demo
                const hd = {
                    id: contractId || 1,
                    trang_thai: role === "NGUOI_THUE" ? "CHO_KY" : "DA_KY",
                    nguoi_thue: { fullname: "Người Thuê A", id: 2 },
                    chu_tro: { fullname: "Chủ Trọ B" },
                    phong: { ten_phong: "P.101", gia_thue: 3500000 },
                    ngay_bat_dau: "2026-04-10"
                };

                view.innerHTML = `
                    <div class="contract-doc">
                        <div class="contract-title">
                            CỘNG HOÀ XÃ HỘI CHỦ NGHĨA VIỆT NAM<br>
                            Độc lập - Tự do - Hạnh phúc<br>
                            -------------<br>
                            HỢP ĐỒNG THUÊ PHÒNG TRỌ
                        </div>
                        <div class="contract-meta">Mã Hợp Đồng: #HD${hd.id} | Ngày bắt đầu: ${new Date(hd.ngay_bat_dau).toLocaleDateString("vi-VN")}</div>

                        <div class="contract-party">BÊN CHO THUÊ (BÊN A):</div>
                        <p>Họ và tên: <b>${hd.chu_tro.fullname}</b></p>

                        <div class="contract-party">BÊN THUÊ (BÊN B):</div>
                        <p>Họ và tên: <b>${hd.nguoi_thue.fullname}</b></p>
                        
                        <div class="contract-party">NỘI DUNG HỢP ĐỒNG:</div>
                        <p>Bên A đồng ý cho Bên B thuê phòng <b>${hd.phong.ten_phong}</b>. Giá thuê thoả thuận là <b>${parseInt(hd.phong.gia_thue).toLocaleString()} VNĐ/Tháng</b>.</p>
                        <p>Tiền phòng phải nộp trước ngày 05 hằng tháng. Hai bên cam kết thực hiện đúng theo các điều khoản bảo mật hệ thống.</p>
                        
                        <div style="margin-top: 40px; display:flex; justify-content:space-around; text-align:center;">
                            <div>
                                <b>BÊN A (Chủ trọ)</b><br>
                                <i>(Đã tạo trên hệ thống)</i>
                            </div>
                            <div>
                                <b>BÊN B (Người thuê)</b><br>
                                <i style="color:${hd.trang_thai === 'DA_KY' ? 'green' : 'red'}">
                                    ${hd.trang_thai === 'DA_KY' ? '(Đã ký xác nhận)' : '(Chờ ký xác nhận)'}
                                </i>
                            </div>
                        </div>
                    </div>
                `;

                if(role === "NGUOI_THUE" && hd.trang_thai !== "DA_KY") {
                    const btnSign = document.getElementById("btnSign");
                    btnSign.style.display = "block";
                    btnSign.onclick = async () => {
                        if(confirm("Bạn có chắc chắn chấp nhận thuê và ký bản hợp đồng này?")) {
                            // await fetchAPI(`/hopdong/${hd.id}/xac-nhan`, "POST");
                            showToast("Bạn đã ký hợp đồng thành công!", "success");
                            btnSign.style.display = "none";
                            setTimeout(() => loadContract(), 1000);
                        }
                    };
                }

            } catch(e) {
                view.innerHTML = `<div class="empty-hint error">Lỗi tải dữ liệu.</div>`;
            }
        }

        window.addEventListener("load", loadContract);
    </script>
</body>
</html>
