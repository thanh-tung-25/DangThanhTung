<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hợp đồng · Phòng trọ</title>
    <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body class="app-body">

<header class="topbar">
    <div class="topbar__brand">
        <span class="topbar__logo" aria-hidden="true">⌂</span>
        <div>
            <div class="topbar__title">Phòng trọ</div>
            <div class="topbar__tagline">Hợp đồng</div>
        </div>
    </div>
    <div class="topbar__actions">
        <span id="userLabel" class="user-pill"></span>
        <button type="button" class="btn btn--ghost" onclick="logout()">Đăng xuất</button>
    </div>
</header>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<div class="app-shell">
    <aside class="sidebar" aria-label="Menu">
        <nav id="sidebarNav" class="sidebar__nav"></nav>
    </aside>

    <main class="layout layout--with-sidebar">
        <section class="panel">
            <div class="panel__head">
                <h2 class="panel__title">Danh sách hợp đồng</h2>
                <p class="panel__desc">Từ <code class="inline-code">GET /api/hopdong</code>. Có nút xác nhận (nếu backend cho phép) gọi <code class="inline-code">PATCH /api/hopdong/:id/xac-nhan</code>.</p>
            </div>
            <div id="contracts" class="list"></div>
        </section>
    </main>
</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script type="module">
import { getHopDong, xacNhanHopDong } from "../js/modules/hopdong.js";
import { getUser, logout } from "../js/core/auth.js";
import { initSocket } from "../js/socket/socket.js";
import { renderSidebar } from "../js/ui/sidebar.js";

window.logout = logout;

const user = getUser();
if (!user || user.id == null) {
    window.location.href = "dangnhap.html";
} else {
    document.getElementById("userLabel").textContent = user.username || "Đã đăng nhập";
    initSocket(user.id);
    renderSidebar(document.getElementById("sidebarNav"), user, "hopdong.html");
}

const escapeHtml = (s) =>
    String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");

const renderContracts = (data) => {
    if (!Array.isArray(data) || data.length === 0) {
        return `<p class="empty-hint">Chưa có hợp đồng.</p>`;
    }

    return data.map((c) => {
        const id = c.id ?? c.hopdong_id ?? "";
        const status = c.status ?? c.trang_thai ?? "—";
        const roomId = c.room_id ?? c.phong_id ?? "—";
        const start = c.start_date ?? c.ngay_bat_dau ?? "—";
        const end = c.end_date ?? c.ngay_ket_thuc ?? "—";
        const canConfirm = String(status).toUpperCase().includes("PENDING") || String(status).toUpperCase().includes("CHO_XAC_NHAN");

        return `
            <div class="list-item">
                <div class="list-item__main">
                    <div class="list-item__title">Hợp đồng #${escapeHtml(id)} <span class="badge">${escapeHtml(status)}</span></div>
                    <div class="list-item__meta">Phòng #${escapeHtml(roomId)} · ${escapeHtml(start)} → ${escapeHtml(end)}</div>
                </div>
                <div class="list-item__actions">
                    <button type="button" class="btn btn--ghost btn--sm js-confirm" data-id="${escapeHtml(id)}" ${canConfirm ? "" : "disabled"}>
                        Xác nhận
                    </button>
                </div>
            </div>
        `;
    }).join("");
};

const load = async () => {
    const el = document.getElementById("contracts");
    try {
        const data = await getHopDong();
        el.innerHTML = renderContracts(data);
    } catch {
        el.innerHTML = `<p class="empty-hint error">Không tải được hợp đồng.</p>`;
    }
};

document.getElementById("contracts").addEventListener("click", async (e) => {
    const btn = e.target.closest?.(".js-confirm");
    if (!btn || btn.disabled) return;

    const id = btn.dataset.id;
    btn.disabled = true;
    try {
        await xacNhanHopDong(id);
        await load();
    } catch {
        btn.disabled = false;
        alert("Không xác nhận được hợp đồng.");
    }
});

await load();
</script>

</body>
</html>
