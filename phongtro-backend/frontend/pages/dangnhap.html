<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập - SmartRoom</title>
    <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body class="auth-page">

    <div class="auth-shell">
        <div class="auth-brand">
            <div class="auth-brand__icon">🏢</div>
            <h1 class="auth-brand__title">SmartRoom</h1>
            <p class="auth-brand__subtitle">Hệ thống quản lý phòng trọ thông minh</p>
        </div>

        <div class="auth-card">
            <h2 class="auth-card__heading">Đăng nhập tài khoản</h2>
            
            <form id="loginForm" class="auth-form">
                <div class="field" style="margin-bottom: 2px;">
                    <label class="field__label">Tên đăng nhập</label>
                    <input type="text" id="username" placeholder="Nhập tên đăng nhập..." required />
                </div>
                
                <div class="field" style="margin-bottom: 15px;">
                    <label class="field__label">Mật khẩu</label>
                    <input type="password" id="password" placeholder="Nhập mật khẩu..." required />
                </div>
                
                <button type="submit" id="btnSubmit" class="btn btn--primary btn--block">
                    Đăng nhập hệ thống
                </button>
            </form>

            <p class="auth-footnote text-center" style="text-align: center; margin-top: 24px;">
                Chưa có tài khoản? <a href="dangky.html" style="color: var(--accent);text-decoration:none;font-weight:600;">Đăng ký ngay</a>
            </p>
        </div>
    </div>

    <script type="module">
        import { CONFIG, showToast } from "../js/utils/config.js";

        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById("btnSubmit");
            btn.textContent = "Đang đăng nhập...";
            btn.disabled = true;

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();

            try {
                const res = await fetch(`${CONFIG.API_URL}/auth/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.message || "Tài khoản hoặc mật khẩu không đúng!");

                localStorage.setItem("access_token", data.accessToken);
                localStorage.setItem("role", data.user.role);
                localStorage.setItem("user", JSON.stringify(data.user));

                showToast("Đăng nhập thành công!", "success");

                // Chuyển trang theo Role
                setTimeout(() => {
                    if (data.user.role === "ADMIN") {
                        window.location.href = "quanlynguoidung.html";
                    } else {
                        window.location.href = "trangchu.html";
                    }
                }, 800);

            } catch (err) {
                showToast(err.message, "error");
                btn.textContent = "Đăng nhập hệ thống";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
