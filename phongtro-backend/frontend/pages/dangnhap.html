<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Hệ thống Quản lý Phòng trọ</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS Liên kết -->
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/auth.css">
    <link rel="stylesheet" href="../assets/css/3d-house.css">
</head>
<body>
    <!-- Navbar ẩn trong trang đăng nhập -->
    <nav id="main-nav" style="display: none;"></nav>
    <div id="toast-container"></div>

    <div class="split-screen">
        <!-- Left: Form -->
        <div class="split-left">
            <div class="auth-card">
                <h2 class="auth-title text-primary">Đăng Nhập</h2>
                <p class="auth-subtitle">Truy cập hệ thống quản lý phòng trọ thông minh.</p>
                
                <form id="login-form">
                    <div class="form-group">
                        <input type="text" id="username" class="form-control" placeholder="Tên đăng nhập" required>
                        <i class="fa-solid fa-user form-icon"></i>
                    </div>
                    
                    <div class="form-group">
                        <input type="password" id="password" class="form-control" placeholder="Mật khẩu" required>
                        <i class="fa-solid fa-lock form-icon"></i>
                    </div>

                    <div class="auth-options">
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; color: var(--clr-text-muted);">
                            <input type="checkbox"> Ghi nhớ đăng nhập
                        </label>
                        <a href="#" class="forgot-link">Quên mật khẩu?</a>
                    </div>
                    
                    <button type="submit" id="btn-login" class="btn btn-primary btn-submit">
                        Đăng Nhập <i class="fa-solid fa-arrow-right-to-bracket"></i>
                    </button>
                </form>
                
                <div class="auth-switch">
                    <span>Chưa có tài khoản?</span>
                    <a href="dangky.html">Đăng ký ngay</a>
                </div>
            </div>
        </div>

        <!-- Right: Graphics -->
        <div class="split-right">
            <div class="graphic-container">
                <div class="isometric-scene">
                    <div class="iso-shadow"></div>
                    <div class="iso-floor"></div>
                    <div class="iso-wall-left">
                        <div class="iso-door" title="Login"><i class="fa-solid fa-key"></i></div>
                    </div>
                    <div class="iso-wall-right">
                        <div class="iso-window"></div>
                        <div class="iso-window"></div>
                    </div>
                    <div class="iso-roof"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script Logic -->
    <script type="module" src="dangnhap.js"></script>
</body>
</html>
