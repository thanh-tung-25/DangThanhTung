<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý phòng - SmartRoom</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <script type="module" src="../js/core/layout.js"></script>
</head>
<body>
    <div id="app-root">
        <!-- Layout.js Shell -->
        
        <div class="panel">
            <div class="panel__head" style="display:flex; justify-content:space-between; align-items:center;">
                <div>
                    <h2 class="panel__title">Quản lý Phòng Trọ</h2>
                    <p class="panel__desc">Theo dõi tình trạng và cập nhật thông tin phòng</p>
                </div>
                <button class="btn btn--primary" id="btnShowAddRoom">+ Thêm Phòng Mới</button>
            </div>

            <!-- Stats -->
            <div class="stats" style="margin-bottom: 24px;">
                <div class="stat">
                    <div class="stat__label">Tổng số phòng</div>
                    <div class="stat__value" id="statTotal">0</div>
                </div>
                <div class="stat stat--success">
                    <div class="stat__label">Đã cho thuê</div>
                    <div class="stat__value" id="statRented">0</div>
                </div>
                <div class="stat stat--danger">
                    <div class="stat__label">Đang trống</div>
                    <div class="stat__value" id="statEmpty">0</div>
                </div>
            </div>

            <!-- Composer Thêm Phòng (Mặc định ẩn) -->
            <div id="add-room-form" class="composer" style="display:none; margin-bottom: 24px;">
                <div class="composer__head">
                    <span class="composer__title">Khởi tạo phòng mới</span>
                    <button class="btn btn--ghost btn--sm" id="btnCancelAdd">Huỷ</button>
                </div>
                <form id="formRoom" class="composer__body grid-two">
                    <div class="field">
                        <label class="field__label">Tên / Số phòng</label>
                        <input type="text" id="rName" placeholder="P.101" required>
                    </div>
                    <div class="field">
                        <label class="field__label">Giá thuê (VND/Tháng)</label>
                        <input type="number" id="rPrice" placeholder="2000000" required>
                    </div>
                    <div class="field" style="grid-column: span 2;">
                        <label class="field__label">Mô tả (Tiện ích, diện tích...)</label>
                        <textarea id="rDesc" class="composer__input" rows="2" placeholder="Diện tích 20m2, khép kín, có điều hoà..."></textarea>
                    </div>
                    <div class="composer__actions" style="grid-column: span 2;">
                        <button type="submit" class="btn btn--primary" id="btnSaveRoom">Lưu phòng</button>
                    </div>
                </form>
            </div>

            <!-- Danh sách phòng -->
            <div class="grid grid--rooms" id="rooms-container">
                <div class="empty-hint" style="grid-column: 1/-1;">Đang tải dữ liệu phòng...</div>
            </div>

        </div>

        <template id="room-tmpl">
            <div class="room-card">
                <span class="room-card__badge" data-field="statusBadge">TRỐNG</span>
                <h3 class="room-card__title" data-field="name">Tên Phòng</h3>
                <div class="room-card__price" data-field="price">0 đ</div>
                <p class="room-card__desc" data-field="desc">Mô tả chi tiết phòng...</p>
                <div style="margin-top:auto; display:flex; gap:8px;">
                    <button class="btn btn--ghost btn--sm btn--block btn-action">Sửa đổi</button>
                </div>
            </div>
        </template>
        
    </div>

    <script type="module">
        import { fetchAPI, showToast } from "../js/utils/config.js";

        const btnShowAdd = document.getElementById("btnShowAddRoom");
        const formDiv = document.getElementById("add-room-form");
        const btnCancel = document.getElementById("btnCancelAdd");

        btnShowAdd.addEventListener("click", () => {
            formDiv.style.display = "block";
            btnShowAdd.style.display = "none";
        });
        
        btnCancel.addEventListener("click", () => {
            formDiv.style.display = "none";
            btnShowAdd.style.display = "inline-flex";
            document.getElementById("formRoom").reset();
        });

        // Form Tạo Phòng
        document.getElementById("formRoom").addEventListener("submit", async(e) => {
            e.preventDefault();
            const btn = document.getElementById("btnSaveRoom");
            btn.disabled = true;

            const body = {
                title: document.getElementById("rName").value,
                price: document.getElementById("rPrice").value,
                description: document.getElementById("rDesc").value,
                status: "AVAILABLE"
            };

            try {
                await fetchAPI("/phong", "POST", body);
                showToast("Đã tạo phòng thành công!");
                btnCancel.click();
                loadRooms();
            } catch(err) {
                showToast(err.message || "Lỗi khi tạo phòng", "error");
            } finally {
                btn.disabled = false;
            }
        });

        async function loadRooms() {
            const container = document.getElementById("rooms-container");
            try {
                const rooms = await fetchAPI("/phong/me");
                if(!rooms || rooms.length === 0) {
                    container.innerHTML = '<div class="empty-hint" style="grid-column: 1/-1;">Chưa có phòng nào.</div>';
                    // Reset stats
                    document.getElementById("statTotal").textContent = "0";
                    document.getElementById("statRented").textContent = "0";
                    document.getElementById("statEmpty").textContent = "0";
                    return;
                }

                container.innerHTML = "";
                const tmpl = document.getElementById("room-tmpl");
                
                let rented = 0;
                let empty = 0;

                rooms.forEach(room => {
                    const node = tmpl.content.cloneNode(true);
                    node.querySelector('[data-field="name"]').textContent = room.title;
                    node.querySelector('[data-field="price"]').textContent = parseInt(room.price).toLocaleString() + " đ";
                    node.querySelector('[data-field="desc"]').textContent = room.description || "Không có mô tả.";
                    
                    const badge = node.querySelector('[data-field="statusBadge"]');
                    if(room.status === "OCCUPIED") {
                        badge.textContent = "ĐÃ CHO THUÊ";
                        badge.style.background = "rgba(46, 204, 113, 0.2)";
                        badge.style.color = "var(--success)";
                        rented++;
                    } else {
                        badge.textContent = "TRỐNG";
                        empty++;
                    }

                    // Thêm sự kiện cho nút Sửa đổi
                    const btnSua = node.querySelector('.btn-action');
                    if (btnSua) {
                        btnSua.onclick = () => {
                            showToast("Chức năng sửa đổi đang được cập nhật...", "success");
                        };
                    }

                    container.appendChild(node);
                });

                document.getElementById("statTotal").textContent = rooms.length;
                document.getElementById("statRented").textContent = rented;
                document.getElementById("statEmpty").textContent = empty;

            } catch (err) {
                container.innerHTML = `<div class="empty-hint error" style="grid-column: 1/-1;">Lỗi lấy dữ liệu phòng.</div>`;
            }
        }

        window.addEventListener("load", loadRooms);
    </script>
</body>
</html>
