<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thông Báo Hệ Thống - SmartRoom</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <script type="module" src="../js/core/layout.js"></script>
</head>
<body>
    <div id="app-root">
        <div class="panel">
            <div class="panel__head">
                <h2 class="panel__title">Thông báo của bạn</h2>
            </div>
            
            <div class="list" id="notif-container">
                <div class="list-item" style="border-left: 4px solid var(--accent);">
                    <div class="list-item__main">
                        <div class="list-item__title">Chào mừng đến với SmartRoom</div>
                        <div class="list-item__meta">Hệ thống quản lý phòng trọ hiện đại, giúp bạn tiết kiệm thời gian.</div>
                    </div>
                    <div class="list-item__actions">
                        <span style="font-size:0.8rem; color:var(--muted);">Vừa xong</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
