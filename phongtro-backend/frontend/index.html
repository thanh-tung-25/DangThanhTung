<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quản lý Phòng trọ</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="./assets/css/main.css">
</head>
<body>
    <!-- Navbar sẽ được load động hoặc ẩn hiện dựa vào router -->
    <nav id="main-nav" style="display: none;">
        <div class="nav-container">
            <a href="/" data-link class="nav-logo">
                <i class="fa-solid fa-building-user"></i> RoomManager
            </a>
            <div class="nav-links" id="nav-links">
                <!-- Dynamic links based on role -->
            </div>
            <div class="nav-user">
                <span id="nav-username"></span>
                <button id="btn-logout" class="btn btn-outline-danger btn-sm">
                    <i class="fa-solid fa-right-from-bracket"></i> Đăng xuất
                </button>
            </div>
        </div>
    </nav>

    <!-- Content Area -->
    <main id="app">
        <div class="loader">
            <i class="fa-solid fa-circle-notch fa-spin"></i> Đang tải...
        </div>
    </main>

    <!-- Toast Notification Container -->
    <div id="toast-container"></div>

    <script type="module">
        import { auth } from './js/auth.js';

        // Khởi tạo app
        document.addEventListener('DOMContentLoaded', async () => {
            await auth.init();
            
            const basePathMatch = window.location.pathname.match(/^(\/.*?\/frontend)/i);
            const basePath = basePathMatch ? basePathMatch[1] : '';

            if (!auth.isAuthenticated()) {
                window.location.href = basePath + '/pages/dangnhap.html';
                return;
            }

            const role = auth.getRole();
            if (role === 'LANDLORD') {
                window.location.href = basePath + '/pages/landlord/trangchu.html';
            } else if (role === 'TENANT') {
                window.location.href = basePath + '/pages/tenant/feed.html';
            } else if (role === 'ADMIN') {
                window.location.href = basePath + '/pages/admin/quanlyuser.html';
            } else {
                window.location.href = basePath + '/pages/dangnhap.html';
            }
        });
    </script>
</body>
</html>
