<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoomManager - Redirecting...</title>
    <!-- Tự động chuyển hướng tới trang Đăng nhập / Bảng tin tùy theo logic -->
    <meta http-equiv="refresh" content="0; url=trang/xac_thuc/dang_nhap.html">
    <style>
        body { font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f8fafc; color: #64748b; }
    </style>
</head>
<body>
    <div style="text-align: center;">
        <i class="fa-solid fa-circle-notch fa-spin fa-2x" style="color: #0ea5e9; margin-bottom: 1rem;"></i>
        <p>Đang chuyển hướng vào hệ thống...</p>
        <script>
            // Thử kiểm tra localStorage xem có user không, nếu có thì redirect thẳng
            try {
                const token = localStorage.getItem('roommanager_token');
                const userRaw = localStorage.getItem('roommanager_user');
                if (token && userRaw) {
                    const user = JSON.parse(userRaw);
                    if (user.role === 'LANDLORD') {
                        window.location.href = 'trang/chu_tro/bang_dieu_khien.html';
                    } else if (user.role === 'TENANT') {
                        window.location.href = 'trang/nguoi_thue/bang_tin.html';
                    } else {
                        window.location.href = 'trang/xac_thuc/dang_nhap.html';
                    }
                } else {
                    window.location.href = 'trang/xac_thuc/dang_nhap.html';
                }
            } catch(e) {
                window.location.href = 'trang/xac_thuc/dang_nhap.html';
            }
        </script>
    </div>
</body>
</html>
