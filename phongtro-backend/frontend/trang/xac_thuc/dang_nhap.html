<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - RoomManager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../tai_nguyen/css/dang_nhap.css">
</head>
<body>
    <div class="auth-layout">
        <!-- Cột trái: Giới thiệu -->
        <div class="auth-left">
            <h1>Quản Lý<br>Phòng Trọ<br>Dễ Dàng Hơn.</h1>
            <p>Hệ thống tự động hóa quản lý hợp đồng, thanh toán và kết nối giữa chủ trọ và người thuê một cách minh bạch, tiện lợi.</p>
            <div style="position: absolute; bottom: -50px; right: -50px; opacity: 0.1;">
                <i class="fa-solid fa-building" style="font-size: 30rem;"></i>
            </div>
        </div>

        <!-- Cột phải: Form đăng nhập -->
        <div class="auth-right">
            <div class="auth-card">
                <div class="auth-header">
                    <h2>Chào mừng trở lại!</h2>
                    <p>Vui lòng đăng nhập để tiếp tục</p>
                </div>

                <form id="form-login">
                    <div class="form-group">
                        <label>Tên đăng nhập</label>
                        <div class="input-icon-wrap">
                            <i class="fa-solid fa-user"></i>
                            <input type="text" class="auth-input" id="username" placeholder="Nhập tên đăng nhập" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Mật khẩu</label>
                        <div class="input-icon-wrap">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" class="auth-input" id="password" placeholder="Nhập mật khẩu" required>
                        </div>
                    </div>
                    <div style="text-align: right; margin-bottom: 1rem;">
                        <a href="quen_mat_khau.html" style="color: #0ea5e9; font-size: 0.85rem; text-decoration: none;">Quên mật khẩu?</a>
                    </div>

                    <button type="submit" class="btn-auth" id="btn-submit">
                        Đăng Nhập
                    </button>
                </form>

                <div class="auth-footer">
                    Chưa có tài khoản? <a href="dang_ky.html">Đăng ký ngay</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Container cho Toast Error -->
    <div id="toast-container" style="position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px;"></div>

    <script type="module">
        import { auth } from '../../tai_nguyen/js/xac_thuc.js';

        // Ngăn người dùng đã đăng nhập vào lại trang này
        auth.checkGuest();

        // Hàm render Toast rút gọn cho trang Auth
        function showAuthToast(msg) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.style.cssText = "background: #fff; border-left: 4px solid #ef4444; border-radius: 8px; padding: 1rem 1.5rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 1rem; transform: translateX(120%); transition: all 0.3s; min-width: 250px;";
            toast.innerHTML = `<i class="fa-solid fa-circle-exclamation" style="color: #ef4444;"></i> <div style="flex:1; color:#1e293b; font-size:0.9rem;">${msg}</div>`;
            container.appendChild(toast);
            setTimeout(() => toast.style.transform = 'translateX(0)', 10);
            setTimeout(() => {
                toast.style.transform = 'translateX(120%)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!username || !password) return;

            try {
                btn.disabled = true;
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang xử lý...';
                
                await auth.login(username, password);
                // Sau khi login xong, xac_thuc.js sẽ tự động redirect theo role
            } catch (error) {
                // Hiển thị lỗi ra UI (Bước 26)
                showAuthToast(error.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Đăng Nhập';
            }
        });
    </script>
</body>
</html>
