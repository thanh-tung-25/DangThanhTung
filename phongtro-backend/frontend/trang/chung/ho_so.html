<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ Sơ Cá Nhân - RoomManager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../tai_nguyen/css/global.css">
    <link rel="stylesheet" href="../../tai_nguyen/css/ho_so.css">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar sẽ được load động tùy theo Role -->
        <div id="sidebar-container"></div>
        
        <div class="main-content">
            <div id="navbar-container"></div>
            
            <div class="page-container">
                <div class="profile-layout">
                    
                    <!-- Cột trái: Avatar & Thông tin cơ bản (Bước 23) -->
                    <div class="profile-card">
                        <div class="profile-avatar-wrap">
                            <div class="profile-avatar" id="avatar-preview">U</div>
                            <div class="btn-upload-avatar" title="Đổi ảnh đại diện (Đang phát triển)">
                                <i class="fa-solid fa-camera"></i>
                            </div>
                        </div>
                        <div class="profile-name" id="display-name">Loading...</div>
                        <div class="profile-role" id="display-role">ROLE</div>
                        
                        <p style="color: #64748b; font-size: 0.9rem; line-height: 1.5; margin-bottom: 1.5rem;">
                            Cập nhật thông tin của bạn để bảo mật tài khoản và giao tiếp dễ dàng hơn.
                        </p>
                    </div>

                    <!-- Cột phải: Form cập nhật -->
                    <div>
                        <!-- Form Thông Tin (Bước 23) -->
                        <div class="settings-card">
                            <div class="settings-header">
                                <i class="fa-solid fa-user-pen text-blue-500"></i> Thông Tin Cá Nhân
                            </div>
                            <form id="form-profile">
                                <div class="form-grid">
                                    <div class="form-group">
                                        <label>Tên đăng nhập (Username)</label>
                                        <input type="text" class="form-input" id="profile-username" required>
                                    </div>
                                    <div class="form-group">
                                        <label>ID Người Dùng</label>
                                        <input type="text" class="form-input" id="profile-id" disabled>
                                    </div>
                                </div>
                                <div class="form-grid">
                                    <div class="form-group">
                                        <label>Email liên hệ</label>
                                        <input type="email" class="form-input" id="profile-email" placeholder="Ví dụ: example@gmail.com">
                                    </div>
                                    <div class="form-group">
                                        <label>Số điện thoại</label>
                                        <input type="tel" class="form-input" id="profile-phone" placeholder="0123 456 789">
                                    </div>
                                </div>
                                <div style="display: flex; justify-content: flex-end;">
                                    <button type="submit" class="btn-save" id="btn-save-profile">
                                        <i class="fa-solid fa-floppy-disk"></i> Lưu thay đổi
                                    </button>
                                </div>
                            </form>
                        </div>

                        <!-- Form Đổi Mật Khẩu (Bước 24) -->
                        <div class="settings-card" style="margin-bottom: 0;">
                            <div class="settings-header">
                                <i class="fa-solid fa-shield-halved text-blue-500"></i> Đổi Mật Khẩu
                            </div>
                            <form id="form-password">
                                <div class="form-group">
                                    <label>Mật khẩu hiện tại</label>
                                    <input type="password" class="form-input" id="pwd-old" placeholder="Nhập mật khẩu cũ..." required>
                                </div>
                                <div class="form-grid">
                                    <div class="form-group">
                                        <label>Mật khẩu mới</label>
                                        <input type="password" class="form-input" id="pwd-new" placeholder="Tối thiểu 6 ký tự..." required minlength="6">
                                    </div>
                                    <div class="form-group">
                                        <label>Xác nhận mật khẩu mới</label>
                                        <input type="password" class="form-input" id="pwd-confirm" placeholder="Nhập lại mật khẩu mới..." required minlength="6">
                                    </div>
                                </div>
                                <div style="display: flex; justify-content: flex-end;">
                                    <button type="submit" class="btn-save" id="btn-save-password" style="background: linear-gradient(135deg, #10b981, #059669);">
                                        <i class="fa-solid fa-key"></i> Đổi mật khẩu
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Tạm dùng chung logic Sidebar riêng cho trang Hồ Sơ -->
    <script type="module">
        import { app } from '../../tai_nguyen/js/app.js';
        import { auth } from '../../tai_nguyen/js/xac_thuc.js';
        import { nguoiDungService } from '../../dich_vu/nguoi_dung.service.js';

        // Ghi đè loadComponent để tự động nhúng đúng Sidebar tùy theo Role
        const originalLoad = app.loadComponent;
        app.loadComponent = async function(id, url) {
            if (id === 'sidebar-container') {
                const userRole = auth.user ? auth.user.role : '';
                if (userRole === 'TENANT') {
                    // Inject sidebar của người thuê
                    const container = document.getElementById(id);
                    container.innerHTML = `
                        <aside class="sidebar">
                            <div class="sidebar-logo">RoomManager</div>
                            <ul class="sidebar-menu">
                                <li><a href="../../trang/nguoi_thue/bang_tin.html"><i class="fa-solid fa-newspaper"></i> Bảng tin phòng</a></li>
                                <li><a href="../../trang/nguoi_thue/tin_nhan.html"><i class="fa-solid fa-comment-dots"></i> Tin nhắn</a></li>
                                <li><a href="../../trang/nguoi_thue/hop_dong.html"><i class="fa-solid fa-file-contract"></i> Hợp đồng</a></li>
                                <li><a href="../../trang/nguoi_thue/nhom.html"><i class="fa-solid fa-users"></i> Nhóm trọ</a></li>
                                <li><a href="../../trang/nguoi_thue/hoa_don.html"><i class="fa-solid fa-file-invoice-dollar"></i> Thanh toán</a></li>
                                <li><a href="../../trang/nguoi_thue/thong_bao.html"><i class="fa-solid fa-bell"></i> Thông báo</a></li>
                                <li><a href="../../trang/chung/ho_so.html" class="active"><i class="fa-solid fa-user"></i> Hồ sơ cá nhân</a></li>
                            </ul>
                            <div class="sidebar-footer">
                                <button id="btn-logout" class="btn-logout"><i class="fa-solid fa-sign-out-alt"></i> Đăng xuất</button>
                            </div>
                        </aside>
                    `;
                    return;
                } else if (userRole === 'LANDLORD') {
                    // Gọi sidebar gốc của landlord nhưng thêm item Hồ sơ cá nhân
                    await originalLoad.call(app, id, url);
                    const menu = document.querySelector('.sidebar-menu');
                    if(menu) {
                        menu.innerHTML += `<li><a href="../../trang/chung/ho_so.html" class="active"><i class="fa-solid fa-user"></i> Hồ sơ cá nhân</a></li>`;
                    }
                    return;
                }
            }
            await originalLoad.call(app, id, url);
        };

        // Bỏ qua kiểm tra role cụ thể (truyền null) vì trang này ai cũng vào được
        await app.init('Hồ Sơ Cá Nhân', null);

        // Load dữ liệu lên form
        async function loadProfile() {
            try {
                const user = await nguoiDungService.layThongTin();
                if (!user) return;

                // Cột trái
                document.getElementById('display-name').textContent = user.username;
                document.getElementById('display-role').textContent = user.role === 'LANDLORD' ? 'CHỦ TRỌ' : (user.role === 'TENANT' ? 'NGƯỜI THUÊ' : user.role);
                document.getElementById('avatar-preview').textContent = user.username[0].toUpperCase();

                // Form giữa
                document.getElementById('profile-id').value = user.id;
                document.getElementById('profile-username').value = user.username;
                document.getElementById('profile-email').value = user.email || '';
                document.getElementById('profile-phone').value = user.phone || '';
            } catch (error) {
                console.error("Lỗi lấy thông tin", error);
            }
        }

        // Xử lý Cập nhật Profile (Bước 23)
        document.getElementById('form-profile').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-save-profile');
            
            const data = {
                username: document.getElementById('profile-username').value,
                email: document.getElementById('profile-email').value,
                phone: document.getElementById('profile-phone').value
            };

            try {
                btn.disabled = true;
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang lưu...';
                
                await nguoiDungService.capNhatProfile(data);
                
                app.showToast('Thành công', 'Hồ sơ cá nhân đã được cập nhật!', 'success');
                
                // Update UI header & sidebar
                document.getElementById('user-name').textContent = data.username;
                document.getElementById('user-avatar').textContent = data.username[0].toUpperCase();
                loadProfile();
            } catch (error) {
                alert('Lỗi: ' + error.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Lưu thay đổi';
            }
        });

        // Xử lý Đổi Mật Khẩu (Bước 24)
        document.getElementById('form-password').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const oldPwd = document.getElementById('pwd-old').value;
            const newPwd = document.getElementById('pwd-new').value;
            const confirmPwd = document.getElementById('pwd-confirm').value;

            // Validate
            if (newPwd !== confirmPwd) {
                alert('Mật khẩu mới không khớp!');
                return;
            }

            const btn = document.getElementById('btn-save-password');
            try {
                btn.disabled = true;
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang xử lý...';
                
                await nguoiDungService.doiMatKhau(oldPwd, newPwd);
                
                app.showToast('Bảo mật', 'Mật khẩu đã được thay đổi an toàn.', 'success');
                document.getElementById('form-password').reset();
            } catch (error) {
                alert('Lỗi: ' + error.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-key"></i> Đổi mật khẩu';
            }
        });

        loadProfile();
    </script>
</body>
</html>
